train_mode: True
use_wandb: False

# encoder
encoder: ["resnet", "BasicBlock", [2, 2, 2, 2]]
# ["resnet", "BasicBlock", [2, 2, 2, 2]] # resnet-18
# ["resnet", "BasicBlock", [2, 2, 2, 2]] # resnet-18
# ["resnet", "BasicBlock", [3, 4, 6, 3]] # resnet-34
# ["resnet", "Bottleneck", [3, 4, 6, 3]] # resnet-50
# ["resnet", "Bottleneck", [3, 4, 23, 3]] # resnet-101
# ["resnet", "Bottleneck", [3, 8, 36, 3]] # resnet-152
# ["densenet", 32, [6, 12, 24, 16]] # densenet
encoder_output: 256

# decoder
decoder: bidirectional_lstm # [lstm, gru, bidirectional_lstm]
rnn_layer: 2
decoder_output: 128

# fully connected layer
fc_num_layer: 2
fc_hidden_dim: 64

# image
target_index: 5 #몇 frame으로 자를 것인지
stride: 1
augmentation_angle: 45

image_type: rgb # [origin, rgb, diff]
image_resize: True
image_size: !!python/tuple
  - 64
  - 64

# directory
train_data_dir: ../dataset/using_training_data/train
val_data_dir: ../dataset/using_training_data/val
test_data_dir: ../dataset/using_training_data/test
save_dir: ../saved_models
model_dir: C:\Users\user\PycharmProjects\Classification_with_nano17\saved_models\resnet_gru_07-16_12-46-31/epoch_54.pt

optimizer: Adam # [Adam, SGD, rmsprop]
scheduler: None
batch_size: 128
num_epoch: 500
learning_rate: 0.0001
weight_decay: 0.005
dropout: 0.3
loss: MAE # [MSE, MAE, MSE+MAE]
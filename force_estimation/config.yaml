train_mode: True

# encoder
encoder: densenet # [resnet, densenet]
resnet_block: !!python/tuple
  - 2
  - 2
  - 2
  - 2
densenet_block: !!python/tuple
  - 6
  - 12
  - 24
  - 16
densenet_growth: 32
encoder_output: 256

# decoder
decoder: lstm # [lstm, gru, bidirectional_lstm]
rnn_layer: 2
decoder_output: 128

# fully connected layer
fc_num_layer: 1
fc_hidden_dim: 128

# image
use_all_sequence: True # 하나의 시퀀스를 연속적으로 학습할 것인지
target_indices: 5 # 몇 frame으로 자를 것인지
stride: 1

image_type: diff # [origin, rgb, diff]
image_resize: True
image_size: !!python/tuple
  - 61
  - 61

# directory
train_data_dir: ../dataset/two/train
val_data_dir: ../dataset/two/val
test_data_dir: ../dataset/two/test
save_dir: ../saved_models
model_dir: ../saved_models/densenet_lstm_07-14_17-58-52/epoch_65.pt

optimizer: Adam # [Adam, SGD, rmsprop]
scheduler: None
batch_size: 64
num_epoch: 100000
learning_rate: 0.0001
weight_decay: 0.01
dropout: 0.3
loss: MSE # [MSE, MAE, MSE+MAE]
train_mode: False
use_wandb: True

# encoder
encoder: "convNeXt" # resnet18, resnet34, resnet50, densenet121, alexnet, vgg16
encoder_output: 256

# decoder
decoder: bidirectional_lstm # [lstm, gru, bidirectional_lstm]
rnn_layer: 2
decoder_output: 128

# fully connected layer
fc_num_layer: 3
fc_hidden_dim: 1000

# image
frame_length: 30 #몇 frame으로 자를 것인지
stride: 1
augmentation_angle: 45

image_type: zScore # [origin, rgb, diff, zScore]
image_size: !!python/tuple
  - 224
  - 224

# directory
train_data_dir: ../dataset/rft64/train
val_data_dir: ../dataset/rft64/val
test_data_dir: ../dataset/rft64/test
save_dir: ../saved_models
model_dir: /home/gpuadmin/Jins/Classification_with_nano17/saved_models/alexnet_bidirectional_lstm_07-30_10-32-29
optimizer: Adam # [Adam, SGD, rmsprop]
scheduler: None
batch_size: 1
num_epoch: 200
learning_rate: 0.0001
weight_decay: 0.00
dropout: 0.3
loss: MAE # [MSE, MAE, MSE+MAE]

plot_index: -1
train_mode: True
use_wandb: False

# encoder
encoder: "alexnet" # resnet18, resnet34, resnet50, densenet121, alexnet, vgg16
encoder_output: 256

# decoder
decoder: bidirectional_lstm # [lstm, gru, bidirectional_lstm]
rnn_layer: 2
decoder_output: 128

# fully connected layer
fc_num_layer: 3
fc_hidden_dim: 1000

# image
target_index: 12 #몇 frame으로 자를 것인지
stride: 1
augmentation_angle: 45

image_type: rgb # [origin, rgb, diff]
image_size: !!python/tuple
  - 64
  - 64

# directory
train_data_dir: ../dataset/rft64/train
val_data_dir: ../dataset/rft64/val
test_data_dir: ../dataset/rft64/test
save_dir: ../saved_models
model_dir: C:\Users\Jeongmin\PycharmProjects\Classification_with_nano17_manytomany\saved_models\alexnet_bidirectional_lstm_07-28_04-34-41\epoch_180.pt

optimizer: Adam # [Adam, SGD, rmsprop]
scheduler: None
batch_size: 1
num_epoch: 200
learning_rate: 0.0001
weight_decay: 0.005
dropout: 0.3
loss: MSE # [MSE, MAE, MSE+MAE]
train_mode: True
use_wandb: True

# encoder
encoder: "convnext" # resnet18, resnet34, resnet50, densenet121, alexnet, vgg16, convnext, alexnetchange
# encoder_output: 256

# decoder
decoder: lstm # [lstm, transformer, bidirectional_lstm]
decoder_layer: 2
decoder_dimension : 128
decoder_output: 3

# fully connected layer
fc_num_layer: 1
fc_hidden_dim: 0

# image
target_index: 120 #몇 frame으로 자를 것인지
stride: 1

image_type: rgb # [origin, rgb, diff, zScore]
image_size: !!python/tuple
  - 10
  - 8
xflip: True

# directory
dataset_dir: ./dataset

save_dir: ../saved_models
model_dir: ../saved_models/convnext_bidirectional_lstm_90frames_10-14_15-58-22/best_model.pt # 확장자: .pt 또는 .pth

optimizer_type: Adam # [Adam, SGD, rmsprop]
scheduler_type: None
loss_type: MSE # [MSE, MAE, MSE+MAE, huber]

batch_size: 8
num_epoch: 200
learning_rate: 0.0001
weight_decay: 0.001

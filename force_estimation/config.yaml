train_mode: True
use_wandb: False
wandb_project: compare_model

# encoder
encoder: "lightweight_convnexttiny" # resnet18, resnet34, resnet50, densenet121, alexnet, vgg16, convnext, alexnetchange

# decoder
decoder: bidirectional_lstm # [lstm, transformer, bidirectional_lstm]
num_decoder_layer: 2
dim_decoder_hidden : 128

# image
target_index: 30 #몇 frame으로 자를 것인지

image_type: rgb # [origin, rgb, diff, zScore]
image_size: !!python/tuple
  - 6
  - 6
xflip: True

# directory
dataset_dir: ./dataset

save_dir: ../saved_models
model_dir: ../saved_models/convnext_bidirectional_lstm_12-15_00-58-51/best_model.pt # 확장자: .pt 또는 .pth

optimizer_type: Adam # [Adam, SGD, rmsprop]
scheduler_type: None
loss_type: MSE # [MSE, MAE, MSE+MAE, huber]

batch_size: 8
num_epoch: 200
learning_rate: 0.0001
weight_decay: 0.001

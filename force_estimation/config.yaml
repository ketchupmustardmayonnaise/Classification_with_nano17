train_mode: true
use_wandb: true

dataset_path: ./dataset/preprocessed_24subject
save_dir: ../saved_models
model_dir: ../saved_models/best_model.ckpt  # 테스트 모드에서만 사용

batch_size: 64
num_epoch: 200
learning_rate: 0.01
weight_decay: 0.001
max_lr_reductions: 3  # ReduceLROnPlateau: 이 횟수만큼 LR 감소 후 학습 종료
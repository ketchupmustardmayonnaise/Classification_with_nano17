program: wandb_run.py
method: bayes
metric:
  name: validation_MSE
  goal: minimize
name: train_sweep

parameters:
# 바뀌지 않는 parameter들
  batch_size:
    value: 64
  num_epoch:
    value: 100
  train_data_dir:
    value: "../dataset/two/train"
  val_data_dir:
    value: "../dataset/two/val"
  test_data_dir:
    value: "../dataset/two/test"
  save_dir:
    value: "../saved_models"
  densenet_growth:
    value: 32
  scheduler:
    value: None
  resnet_block: 
    value: [2, 2, 2, 2]
  densenet_block:
    value: [6, 12, 24, 16]
  image_size:
    value: [61, 61]
  train_mode:
    value: True

# sweep되는 parameter들
  target_indices:
    values: [5, 8, 10]
  stride:
    values: [1, 3, 5]
  image_type:
    values: ["origin", "rgb", "diff"]
  use_all_sequence:
    values: [True, False]

  encoder:
    values: ["resnet", "densenet"]
  encoder_output:
    values: [64, 128, 256]
  decoder:
    values: ["lstm", "gru", "bidirectional_lstm"]
  decoder_output:
    values: [64, 128, 256]
  rnn_layer:
    values: [1, 2, 3]

  fc_num_layer:
    values: [1, 2, 3]
  fc_hidden_dim:
    values: [64, 128, 256]  

  optimizer:
    values: [Adam, SGD, rmsprop]
  learning_rate:
    min: 0.000001
    max: 0.01
  dropout:
    min: 0.1
    max: 0.5
  weight_decay:
    min: 0.0001
    max: 0.1
  loss:
    values: [MAE, MSE, MSE+MAE]
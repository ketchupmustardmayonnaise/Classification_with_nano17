program: wandb_sweep.py
method: bayes
metric:
  name: validation_MSE
  goal: minimize
name: train_sweep

parameters:
# 바뀌지 않는 parameter들
  train_mode:
    value: True
  use_wandb:
    value: True

  encoder:
    value: "convnext"
  decoder:
    value: "bidirectional_lstm"
  decoder_layer:
    value: 2
  decoder_dimension:
    value: 128
  decoder_output:
    value: 3

  fc_num_layer:
    value: 1
  fc_hidden_dim:
    value: 0

  image_type:
    value: rgb
  image_size:
    value: [10, 8]
  xflip:
    value: True

  train_data_dir:
    value: "./dataset/train_dataset.h5"
  val_data_dir:
    value: "./dataset/val_dataset.h5"
  test_data_dir:
    value: "./dataset/test_dataset.h5"

  save_dir:
    value: "../saved_models"

  optimizer_type:
    value: "Adam"
  scheduler_type:
    value: None
  loss_type:
    value: "MSE"
  loss_weights:
    value: [1.0, 1.0, 1.0]

  batch_size:
    value: 8
  num_epoch:
    value: 200
  learning_rate:
    value: 0.0001
  weight_decay:
    value: 0.001
  stride:
    value: 1

# sweep되는 parameter들
  target_index:
    values: [30, 60, 90, 120]


count: 4
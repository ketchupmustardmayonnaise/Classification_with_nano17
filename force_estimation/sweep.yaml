program: train.py
method: bayes
name: train_sweep
parameters:
  target_indices:
    values: [5, 8, 10]
  image_type:
    values: ["origin", "rgb", "diff"]

  encoder:
    values: ["resnet", "densenet"]
  encoder_output:
    values: [64, 128, 256]
  decoder:
    values: ["lstm", "gru", "bidirectional_lstm"]
  decoder_output:
    values: [64, 128, 256]
  rnn_layer:
    values: [1, 2, 3]

  optimizer:
    values: [Adam, SGD, rmrprop]
  batch_size:
    values: [64, 128]
  learning_rate:
    min: 0.000001
    max: 0.01
  dropout:
    min: 0.1
    max: 0.5
  weight_decay:
    min: 0.0001
    max: 0.1
  loss:
    values: [MAE, MSE, MSE+MAE]
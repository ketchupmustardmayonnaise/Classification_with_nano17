program: wandb_sweep.py
method: bayes
metric:
  name: validation_MSE
  goal: minimize
name: sweep_not_useallsequence

parameters:
# 바뀌지 않는 parameter들
  num_epoch:
    value: 100
  train_data_dir:
    value: "../dataset/two/train"
  val_data_dir:
    value: "../dataset/two/val"
  test_data_dir:
    value: "../dataset/two/test"
  save_dir:
    value: "../saved_models"
  scheduler:
    value: None
  image_size:
    value: [61, 61]
  image_resize:
    value: True
  train_mode:
    value: True

# sweep되는 parameter들
  encoder: 
    values:
      - ["resnet", "BasicBlock", [2, 2, 2, 2]] # resnet-18
      - ["resnet", "BasicBlock", [3, 4, 6, 3]] # resnet-34
      - ["resnet", "Bottleneck", [3, 4, 6, 3]] # resnet-50
      - ["resnet", "Bottleneck", [3, 4, 23, 3]] # resnet-101
      - ["resnet", "Bottleneck", [3, 8, 36, 3]] # resnet-152
      - ["densenet", 32, [6, 12, 24, 16]] # densenet
      - [ "fsnet" ]
  encoder_output:
    values: [64, 128, 256]
  image_type:
    values: ["origin", "rgb", "diff", "exp", "exp_rgb, exp_diff"]

  decoder:
    values:
      - [ False, "bidirectional_lstm" ]
      - [ False, "lstm" ]
      - [ False, "gru" ]
  decoder_output:
    values: [64, 128, 256]
  rnn_layer:
    values: [1, 2, 3]

  fc_num_layer:
    values: [1, 2, 3]
  fc_hidden_dim:
    values: [64, 128, 256]

  target_indices:
    values: [5, 8, 10]
  stride:
    values: [1, 2, 3, 4, 5]

  batch_size:
    values: [32, 64, 128]
  optimizer:
    values: [Adam, SGD, rmsprop]
  learning_rate:
    min: 0.000001
    max: 0.01
  dropout:
    min: 0.1
    max: 0.5
  weight_decay:
    min: 0.0001
    max: 0.1
  loss:
    values: [MAE, MSE, MSE+MAE]
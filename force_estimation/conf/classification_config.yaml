
save_directory: ./saved_models/02-17_03-32-34_lightweight_convnexttiny_transformer

wandb:
  project: HandInterfacesWatch
  entity: pinkmiro-kyung-hee-university
  group: 3subjects_not_cross_person
  log_model: all

data:
  data_dir: ./data/previous_dataset/dataset/bodypart_not_cross_person/all/h5
  length_of_window: 30
  batch_size: 8
  image_size: [6, 6]
  num_classes: 8

  xflip: True
  yflip: False
  translation: False

  # classification 할 때, 하나의 프레임만 참조하지 않고 여러 프레임을 동시에 참조하여 예측함.
  refer_recent_frames_for_classification: 5

model:
  dropout: 0.0
  learning_rate: 0.0001
  weight_decay: 0.001

  encoder_type: lightweight_convnexttiny
  decoder_type: transformer

  classification_type: MTM # MTM or OTO

  transformer:
    num_layers: 2
    dim_feedforward: default
    num_of_head: 2 # for transformer
    export_multistep: True # Many-To-One 또는 Many-To-Many

  lstm:
    num_layers: 2
    is_bidirectional: True # for lstm
    export_multistep: True # Many-To-One 또는 Many-To-Many
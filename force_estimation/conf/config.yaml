save_directory: ./saved_models

wandb:
  project: HandInterfacesWatch
  entity: pinkmiro-kyung-hee-university
  group: 3subjects_not_cross_person
  log_model: all

data:
  dataset_root: ./data/current_dataset/output/bodypart
  fold: 6
  data_dir: ${data.dataset_root}/fold${data.fold}
  length_of_window: 150
  test_touch_only: False
  test_touch_log_threshold: 178.36 #5.1894
  batch_size: 32
  image_size: [6, 6]
  num_classes: 8

  num_workers: 63  # Windows에서 hang 방지. Linux 서버라면 4~8로 올려도 됨

  xflip: True
  yflip: False
  translation: False


model:
  dropout: 0.0
  learning_rate: 0.0001
  weight_decay: 0.001

  encoder_type: lightweight_convnexttiny
  decoder_type: transformer

  transformer:
    num_layers: 12
    dim_feedforward: default
    num_of_head: 2 # for transformer
    export_multistep: True # Many-To-One 또는 Many-To-Many

  lstm:
    num_layers: 2
    size_of_hidden_layer_features: 128
    is_bidirectional: False # for lstm
    export_multistep: False # Many-To-One 또는 Many-To-Many

test:
  checkpoint_path: ./saved_models/fold${data.fold}_regression_ckpt/
  report_last_frame_only: True                          
  output_dir: null
                                                        

save_directory: ./02-17_03-32-34_lightweight_convnexttiny_transformer

wandb:
  project: HandInterfacesWatch
  entity: pinkmiro-kyung-hee-university
  group: 3subjects_not_cross_person
  log_model: all

data:
  data_dir: ./data/current_dataset/dataset/12_dataset_h5
  length_of_window: 30
  batch_size: 8
  image_size: [6, 6]
  num_classes: 8

  xflip: True
  yflip: False
  translation: False

  # classification 할 때, 하나의 프레임만 참조하지 않고 여러 프레임을 동시에 참조하여 예측함.
  # [기존] refer_recent_frames_for_classification: 1
  refer_recent_frames_for_classification: 30

model:
  dropout: 0.0
  learning_rate: 0.0001
  weight_decay: 0.001

  encoder_type: lightweight_convnexttiny
  decoder_type: transformer

  classification_type: OTO # MTM or OTO
  classification_head_type: tcn # linear | gru | lstm | tcn
  classification_head_hidden_size: 128
  classification_head_num_layers: 1
  classification_head_dropout: 0.1
  classification_tcn_kernel_size: 3
  freeze_vf_net_for_classification: true
  freeze_tf_net_for_classification: true

  transformer:
    num_layers: 2
    dim_feedforward: default
    num_of_head: 2 # for transformer
    export_multistep: True # Many-To-One 또는 Many-To-Many

  lstm:
    num_layers: 2
    is_bidirectional: True # for lstm
    export_multistep: True # Many-To-One 또는 Many-To-Many

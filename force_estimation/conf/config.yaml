
save_directory: ./saved_models

resume:
  enabled: False   # True로 두면 중간에 끊긴 학습을 이어서 진행함 (wandb run도 이어짐)
  run_dir: null     # 이어서 학습할 run 폴더 경로. null이면 save_directory 안에서 last.ckpt가 있는 폴더 중 가장 최근 걸 자동으로 사용

wandb:
  project: HandInterfacesWatch
  entity: pinkmiro-kyung-hee-university
  group: 3subjects_not_cross_person
  log_model: all

data:
  data_dir: ./data/current_dataset/output/bodypart/fold1

  # sliding window 길이를 task별로 따로 지정함
  # regression: rf_net(Transformer)의 positional encoding 길이도 이 값으로 정해짐
  # classification: cf_net(LSTM)만 쓰므로 regression과 다른 길이를 자유롭게 써도 됨
  length_of_window:
    regression: 150
    classification: 50

  batch_size: 256
  image_size: [6, 6]
  num_classes: 8

  num_workers: 0  # Windows에서 hang 방지. Linux 서버라면 4~8로 올려도 됨

  xflip: True
  yflip: False
  translation: False
  rotation: False


model:
  dropout: 0.0
  learning_rate: 0.0001
  weight_decay: 0.001

  encoder_type: lightweight_convnexttiny
  decoder_type: transformer

  transformer:
    num_layers: 12
    dim_feedforward: default
    num_of_head: 2 # for transformer
    export_multistep: True # Many-To-One 또는 Many-To-Many

  lstm:
    num_layers: 2
    size_of_hidden_layer_features: 128
    is_bidirectional: False # for lstm
    export_multistep: False # Many-To-One 또는 Many-To-Many
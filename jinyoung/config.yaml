train_mode: "Train"
use_wandb: True

# encoder
encoder: "convNeXt" # resnet18, resnet34, resnet50, densenet121, alexnet, vgg16
encoder_output: 768

# decoder
decoder: "bidirectional_lstm" # [lstm, gru, bidirectional_lstm]
rnn_layer: 2
decoder_output: 128

# fully connected layer
fc_num_layer: 3
fc_hidden_dim: 1000

# image
target_index: 12 #몇 frame으로 자를 것인지
stride: 1
augmentation_angle: 45

image_type: rgb # [origin, rgb, diff]
image_size: !!python/tuple
  - 224
  - 224

# directory
train_data_dir: ../dataset/rft64/
val_data_dir: ../dataset/rft64/
test_data_dir: ../dataset/rft64/test
save_dir: ../saved_models
best_model_dir: None

optimizer_type: Adam # [Adam, SGD, rmsprop]
scheduler: None
batch_size: 1
num_epoch: 200
learning_rate: 0.0001
weight_decay: 0.005
dropout: 0.3
loss: MSE # [MSE, MAE, MSE+MAE]